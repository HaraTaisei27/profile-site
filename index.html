<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hara Taisei | PROFILE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <h1>PROFILE</h1>

    <nav class="tabs" aria-label="ページ内メニュー">
      <button class="tab-button is-active" type="button" data-tab="profile">PROFILE</button>
      <button class="tab-button" type="button" data-tab="photos">PHOTOS</button>
      <button class="tab-button" type="button" data-tab="links">LINKS</button>
    </nav>

    <section id="profile" class="panel is-active" aria-labelledby="profile-heading">
      <h2 id="profile-heading">PROFILE</h2>

      <div class="name-block">
        <p class="name-ja">
          <ruby>
            原<rt>ハラ</rt>
            大晟<rt>タイセイ</rt>
          </ruby>
          <span class="level-badge">Lv.22</span>
        </p>
      </div>

      <dl class="profile-list">
        <div>
          <dt>所属</dt>
          <dd class="education-vertical">
            <span>
              同志社大学
              <a class="profile-link" href="https://www.cis.doshisha.ac.jp/" target="_blank" rel="noopener noreferrer">
                文化情報学部
              </a>
            </span>
            <span class="education-arrow">↓</span>
            <span>
              奈良先端科学技術大学院大学
              <a class="profile-link" href="https://isw3.naist.jp/home-ja.html" target="_blank" rel="noopener noreferrer">
                情報科学領域
              </a>
            </span>
          </dd>
        </div>

        <div>
          <dt>興味</dt>
          <dd>機械学習・データサイエンスを用いたユーザ体験の改善と価値創出</dd>
        </div>

        <div>
          <dt>研究分野</dt>
          <dd>LLM、自然言語処理、推薦システム</dd>
        </div>

        <div>
          <dt>趣味</dt>
          <dd>ランニング、筋トレ、麻雀、ベース、映画鑑賞、音楽をdigることなど。</dd>
        </div>

        <div>
          <dt>最近</dt>
          <dd>お笑い芸人のYouTube観る、自炊、洗濯</dd>
        </div>
      </dl>
    </section>

    <section id="photos" class="panel" aria-labelledby="photos-heading" hidden>
      <h2 id="photos-heading">PHOTOS</h2>

      <figure class="photo-item">
        <img src="assets/Playing.jpg" alt="ベースを演奏している写真">
        <figcaption>ベースを弾くのが好き。</figcaption>
      </figure>

      <figure class="photo-item">
        <img src="assets/travel.jpg" alt="旅行先で撮影した写真">
        <figcaption>旅行好き。でもお金は無い。</figcaption>
      </figure>

      <figure class="photo-item">
        <img src="assets/night_view.jpg" alt="夜景の写真">
        <figcaption>夜景。時間があればまた行きたい。</figcaption>
      </figure>

      <figure class="photo-item">
        <img src="assets/cat.jpeg" alt="実家の猫の写真">
        <figcaption>圧倒的猫派。</figcaption>
      </figure>
    </section>

    <section id="links" class="panel" aria-labelledby="links-heading" hidden>
      <h2 id="links-heading">LINKS</h2>

      <ul class="link-list">
        <li>
          <a href="https://github.com/HaraTaisei27" target="_blank" rel="noopener noreferrer">
          GitHub
          </a>
        </li>
        <li><a href="#" aria-label="Research lab link placeholder">Lab / University</a></li>
        <li><a href="mailto:example@example.com">Mail</a></li>
      </ul>
